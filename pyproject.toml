[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "razorkv"
version = "0.1.0"
description = "Extreme Dynamic KV Cache Sparsification & Layer-Pyramid Eviction for Long-Context LLMs"
readme = "README.md"
authors = [{ name = "RazorKV Core Contributors", email = "dev@razorkv.org" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
]

[project.optional-dependencies]
all = [
    "transformers>=4.36.0",
    "triton>=2.1.0",
    "accelerate",
]
benchmark = [
    "matplotlib",
    "tabulate",
    "tqdm",
]
